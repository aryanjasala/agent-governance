# WordPress for the end-to-end tests: npm run env:start / npm run env:stop.
# It listens on http://localhost:8906, this plugin's own port (WP_PORT moves it).
# The plugin is mounted read-only, so nothing in WordPress can change or delete the source.
name: agent-governance-e2e

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

x-mounts: &mounts
  - wp_data:/var/www/html
  - ../../..:/var/www/html/wp-content/plugins/agent-governance:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp

  wp:
    image: wordpress:${WP_IMAGE_TAG:-php8.3-apache}
    depends_on: [db]
    ports:
      - "127.0.0.1:${WP_PORT:-8906}:80"
    environment: *wp-env
    volumes: *mounts

  cli:
    image: wordpress:cli-php8.3
    depends_on: [db, wp]
    user: "33:33"
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes: *mounts
    command: ["sleep", "infinity"]

volumes:
  wp_data:
